# mise-cloudflare's CI: every check that needs no Cloudflare account, on the template (templates) and on a copy
# stamped out from it (made by the walk), on Linux, macOS and Windows side by side, so a problem on one shows before a
# release (which never waits for CI). Cloudflare credentials never come here.
# Shell steps only, as go-htmx4's: no JavaScript actions.
name: ci

on:
  push:
    branches-ignore: ["e2e-*"] # TestWalk's throwaway branches: they're there for Workers Builds, not for this CI
    tags: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # these steps are the workflow's own; mise runs the tasks in each OS's own shell
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # mise's GitHub downloads
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh, which fetches mise itself on Windows
      MISE_YES: "1"
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: mise and the pinned tools (mise.run, or mise's own Windows build)
        run: |
          native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$1"; else echo "$1"; fi; }
          mkdir -p "$HOME/.local/bin"
          native "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MISE_TRUSTED_CONFIG_PATHS=$(native "$PWD")" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            tag=$(gh release view -R jdx/mise --json tagName -q .tagName)
            curl -fsSL -o "$HOME/.local/bin/mise.exe" "https://github.com/jdx/mise/releases/download/$tag/mise-$tag-windows-x64.exe"
          else
            curl -fsSL https://mise.run | MISE_QUIET=1 sh
          fi
          export PATH="$HOME/.local/bin:$PATH" MISE_TRUSTED_CONFIG_PATHS="$(native "$PWD")"
          mise --version
          mise install

      - name: The tool's own tests (mise run tool:test, after template:setup, whose wrangler they read configs with), and the mise files and the Go lined up, the template's and this repo's (mise run template:check-mise, root:check-mise)
        run: |
          mise run template:setup
          mise run tool:test
          mise run template:check-mise
          mise run root:check-mise

      - name: Every wrangler config in the third-party repos of repos.txt, read and checked as the tasks do (mise run repos:check)
        run: mise run repos:check

      - name: The template, templates - the walk as far as the stage serve, which needs no account, what its own workflow runs included (mise run template:e2e-serve)
        run: mise run template:e2e-serve

      - name: A copy stamped out from it, as a person's repo is - the same walk, on it (mise run new-repo:e2e-serve)
        run: mise run new-repo:e2e-serve
