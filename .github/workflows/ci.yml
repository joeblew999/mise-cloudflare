# mise-cloudflare's CI: every check that needs no Cloudflare account, both ways the steps run, on an existing repo
# (examples/reference) and on a new one (examples/new). Cloudflare credentials never come here.
# Shell steps only, as go-htmx4's: no JavaScript actions.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # mise's GitHub downloads
      MISE_YES: "1"
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: mise and the pinned tools
        run: |
          echo "MISE_TRUSTED_CONFIG_PATHS=$PWD" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://mise.run | MISE_QUIET=1 sh
          export PATH="$HOME/.local/bin:$PATH" MISE_TRUSTED_CONFIG_PATHS="$PWD"
          mise install

      - name: The root against the templates, once the reference is set up (mise run root:check)
        run: mise run root:check

      - name: An existing repo, examples/reference - the steps that need no account (mise run example:try, after tool:test), then what its own workflow runs (mise run example:verify)
        run: |
          mise run example:try
          mise run example:verify

      - name: A new repo, examples/new (mise run example:create) - the same, in it (EXAMPLE=new)
        run: |
          mise run example:create
          EXAMPLE=new mise run example:try
          EXAMPLE=new mise run example:verify
