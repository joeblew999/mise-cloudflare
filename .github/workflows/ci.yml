# mise-cloudflare's CI: every check that needs no Cloudflare account, on the template (templates) and on a copy
# stamped out from it (made by the walk). Cloudflare credentials never come here.
# Shell steps only, as go-htmx4's: no JavaScript actions.
name: ci

on:
  push:
    branches-ignore: ["e2e-*"] # TestWalk's throwaway branches: they're there for Workers Builds, not for this CI
    tags: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # mise's GitHub downloads
      MISE_YES: "1"
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: mise and the pinned tools
        run: |
          echo "MISE_TRUSTED_CONFIG_PATHS=$PWD" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://mise.run | MISE_QUIET=1 sh
          export PATH="$HOME/.local/bin:$PATH" MISE_TRUSTED_CONFIG_PATHS="$PWD"
          mise install

      - name: The tool's own tests (mise run tool:test), and the mise files and the Go lined up, the template's and this repo's (mise run template:check-mise, root:check-mise)
        run: |
          mise run tool:test
          mise run template:check-mise
          mise run root:check-mise

      - name: The template, templates - the walk as far as the stage serve, which needs no account, what its own workflow runs included (mise run template:e2e-serve)
        run: mise run template:e2e-serve

      - name: A copy stamped out from it, as a person's repo is - the same walk, on it (mise run example:e2e-serve)
        run: mise run example:e2e-serve
