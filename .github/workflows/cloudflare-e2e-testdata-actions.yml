# Written by mise-cloudflare (cloudflare workflow, 0.0.0): don't edit it. After upgrading, run
# mise run cloudflare:workflow again; cloudflare:check fails while it's out of date.
#
# What GitHub Actions runs for the Worker in e2e/testdata/actions on every push and pull request: its setup and test tasks if it has
# them, then cloudflare:check (no account or resource IDs, no tokens, secrets listed, wrangler pinned). No Cloudflare
# credentials: Cloudflare's Workers Builds deploys (mise run cloudflare:builds). Shell steps only: no JavaScript actions.
name: cloudflare-e2e-testdata-actions

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: cloudflare-e2e-testdata-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A pull request from this repository already ran as a push; one from a fork runs here, read-only.
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # mise's GitHub downloads
      MISE_YES: "1"
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: mise and the pinned tools
        run: |
          echo "MISE_TRUSTED_CONFIG_PATHS=$PWD" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://mise.run | MISE_QUIET=1 sh
          export PATH="$HOME/.local/bin:$PATH" MISE_TRUSTED_CONFIG_PATHS="$PWD"
          cd "e2e/testdata/actions" && mise install

      - name: setup, test and cloudflare:check, in e2e/testdata/actions
        working-directory: e2e/testdata/actions
        run: |
          if mise tasks info setup > /dev/null 2>&1; then mise run setup; fi
          if mise tasks info test > /dev/null 2>&1; then mise run test; fi
          mise run cloudflare:check

  # cloudflare.toml's [workflow] deploy: GitHub Actions deploys, instead of Workers Builds, with the CLOUDFLARE_API_TOKEN
  # and CLOUDFLARE_ACCOUNT_ID secrets (cloudflare ci-token puts them there): a push to cfz-actions-prod-1792761937 deploys production, and
  # each pull request from this repository gets a preview named pr-<number>, its URL commented on the pull request,
  # deleted when the pull request closes.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cfz-actions-prod-1792761937'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISE_YES: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: mise, the pinned tools, setup
        run: |
          echo "MISE_TRUSTED_CONFIG_PATHS=$PWD" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://mise.run | MISE_QUIET=1 sh
          export PATH="$HOME/.local/bin:$PATH" MISE_TRUSTED_CONFIG_PATHS="$PWD"
          cd "e2e/testdata/actions" && mise install && if mise tasks info setup > /dev/null 2>&1; then mise run setup; fi
      - name: Deploy production
        working-directory: e2e/testdata/actions
        run: mise run cloudflare:deploy

  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the preview's URL on the pull request
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISE_YES: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: mise, the pinned tools, setup
        run: |
          echo "MISE_TRUSTED_CONFIG_PATHS=$PWD" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://mise.run | MISE_QUIET=1 sh
          export PATH="$HOME/.local/bin:$PATH" MISE_TRUSTED_CONFIG_PATHS="$PWD"
          cd "e2e/testdata/actions" && mise install && if mise tasks info setup > /dev/null 2>&1; then mise run setup; fi
      - name: The previews' own KV, D1 and R2, in the Worker's Previews Base
        working-directory: e2e/testdata/actions
        run: mise run cloudflare:previews
      - name: Deploy the preview pr-${{ github.event.number }}, and comment its URL
        working-directory: e2e/testdata/actions
        env:
          PR: ${{ github.event.number }}
        run: |
          out=$(mise run cloudflare:wrangler -- preview --name "pr-$PR" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' <<<"$out" | head -1)
          body="Preview pr-$PR of cloudflare-e2e-testdata-actions: $url (deployed by GitHub Actions at ${GITHUB_SHA:0:7}). <!-- mise-cloudflare:cloudflare-e2e-testdata-actions -->"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '[.[] | select(.body | contains("<!-- mise-cloudflare:cloudflare-e2e-testdata-actions -->"))][0].id // empty')
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null; fi

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISE_YES: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: mise, the pinned tools, setup
        run: |
          echo "MISE_TRUSTED_CONFIG_PATHS=$PWD" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://mise.run | MISE_QUIET=1 sh
          export PATH="$HOME/.local/bin:$PATH" MISE_TRUSTED_CONFIG_PATHS="$PWD"
          cd "e2e/testdata/actions" && mise install && if mise tasks info setup > /dev/null 2>&1; then mise run setup; fi
      - name: Delete the preview pr-${{ github.event.number }}
        working-directory: e2e/testdata/actions
        run: mise run cloudflare:wrangler -- preview delete --name "pr-${{ github.event.number }}" --skip-confirmation
