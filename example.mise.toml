# The steps, in order, exactly as a person does them to a repo that uses mise-cloudflare: mise run example:<step>, at
# the top (mise.toml includes this file). Each runs in the repo REPO_PATH names (a folder here, templates by default), on that repo's own mise only
# (MISE_CEILING_PATHS), never this repo's, and each runs the steps it needs first. A step that asks you something (06,
# 07, 10) runs on your terminal, and no step depends on it. The end-to-end tests (*_test.go, at the top) run them one at a time, in
# this order, as a person does.
#
# On the template, or on a copy stamped out from it:
#   templates, the template (the default):                     mise run example:05-show
#   examples/new, a copy (mise run example:create first):      REPO_PATH=examples/new mise run example:05-show
#
# example:verify runs in the repo what its own GitHub workflow runs (mise run cloudflare:verify): CI runs it on both.
#
# One name and one number all the way through: from 04 on, step example:nn-x runs the repo's task cloudflare:nn-x,
# which runs mise-cloudflare x; steps 00 to 03 come before those tasks exist. The repo's tasks file
# (templates/.mise/tasks/mise-cloudflare.toml) has them in this order too.
#
#   step                     runs                                 what
#   00-git-init              git init                             a git repo, unless it's part of one (the template is this repo's)
#   01-mise-install          mise install                         what it pins: node, aube, mise-cloudflare at local
#   02-setup                 mise run setup                       its own task: aube install
#   03-init                  mise-cloudflare init                 the cloudflare tasks, the skill, the workflow, the hook, the docs
#   04-check                 cloudflare:04-check                  its rules
#   05-show                  cloudflare:05-show                   what's done, and what to run next
#   06-serve                 cloudflare:06-serve                  the Worker locally, no account (Ctrl-C stops it)
#   07-set-secrets           cloudflare:07-set-secrets            the secrets the Worker requires, before it deploys
#   08-deploy                cloudflare:08-deploy                 on Cloudflare, on its own login (the first time, Allow)
#   09-connect-github        cloudflare:09-connect-github         Cloudflare deploys every push: it needs the repo on
#                                                                 GitHub, and the example's own git has none, so here it
#                                                                 stops and says so
#   10-set-preview-secrets   cloudflare:10-set-preview-secrets    the secrets previews require, which they don't inherit
#   11-preview               cloudflare:11-preview                a preview of what's here now, at its own URL
#   12-login                 cloudflare:12-login                  the repo's login (the others make it when they need it)
#   13-delete                cloudflare:13-delete                 08 and 11 undone: the Worker, its KV, D1 and R2, its previews'
#   14-logout                cloudflare:14-logout                 the logins deleted: the next 08-deploy asks for Allow again
#   15-clean                 cloudflare:15-clean                  the local state undone: .wrangler/ and .dev.vars

["example:00-git-init"]
description = "00. git init: the repo a git repo, unless it is part of one already (a person's repo is; the template is part of this one); a stamped copy, which this repo ignores, gets its own"
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "git rev-parse --git-dir >/dev/null 2>&1 && ! git check-ignore -q . || git init -q"

["example:01-mise-install"]
description = "01. mise install: what the repo pins, node, aube, and mise-cloudflare at local (this checkout's build, which mise run tool:install links)"
depends = ["example:00-git-init", "tool:install"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise install"

["example:02-setup"]
description = "02. setup, the repo's own task: aube install, the wrangler package.json pins"
depends = ["example:01-mise-install"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run setup"

["example:03-init"]
description = "03. mise-cloudflare init: writes the template's tool half into the repo (templates: the cloudflare tasks, the agent skill, the workflow, the Claude Code hook and settings, the docs, the .gitignore), each file at its path there"
depends = ["example:02-setup"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise exec -- mise-cloudflare init"

["example:04-check"]
description = "04. cloudflare:04-check: the repo's rules (no tokens or IDs in it, secrets git-ignored, init's files current)"
depends = ["example:03-init"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run cloudflare:04-check"

["example:05-show"]
description = "05. cloudflare:05-show: what's done for the Worker, and what to run next"
depends = ["example:04-check"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run cloudflare:05-show"

["example:06-serve"]
description = "06. cloudflare:06-serve: the Worker locally, with local D1, KV and R2, no account (Ctrl-C stops it)"
depends = ["example:04-check"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
raw = true # it asks you: connected to your terminal, not prefixed
run = "mise run cloudflare:06-serve"

["example:07-set-secrets"]
description = "07. cloudflare:07-set-secrets: the secrets the Worker requires that Cloudflare doesn't have yet, before it deploys (it asks for each)"
depends = ["example:04-check"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
raw = true # it asks you: connected to your terminal, not prefixed
run = "mise run cloudflare:07-set-secrets"

["example:08-deploy"]
description = "08. cloudflare:08-deploy: the Worker on Cloudflare, on the repo's own login (the first time, you click Allow)"
depends = ["example:04-check"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run cloudflare:08-deploy"

["example:09-connect-github"]
description = "09. cloudflare:09-connect-github: Cloudflare deploys every push, a preview for every pull request. It needs the repo on GitHub: the example's own git has none, so here it stops and says so"
depends = ["example:04-check"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run cloudflare:09-connect-github"

["example:10-set-preview-secrets"]
description = "10. cloudflare:10-set-preview-secrets: the secrets previews require, which they don't inherit, in the Worker's Previews Base (after 08-deploy; it asks for each)"
depends = ["example:08-deploy"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
raw = true # it asks you: connected to your terminal, not prefixed
run = "mise run cloudflare:10-set-preview-secrets"

["example:11-preview"]
description = "11. cloudflare:11-preview: a preview of what's here now, at its own URL, with its own KV, D1 and R2 (after 08-deploy; its secrets are 10-set-preview-secrets', set once)"
depends = ["example:08-deploy"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run cloudflare:11-preview --name example"

["example:12-login"]
description = "12. cloudflare:12-login: the repo's Cloudflare login, which the other steps make when they need it"
depends = ["example:04-check"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run cloudflare:12-login"

["example:13-delete"]
description = "13. cloudflare:13-delete: 08-deploy and 11-preview undone, the Worker, its KV, D1 and R2 and its previews' own"
depends = ["example:04-check"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run cloudflare:13-delete --yes"

["example:14-logout"]
description = "14. cloudflare:14-logout: the repo's logins logged out and deleted; the next 08-deploy asks for Allow again"
depends = ["example:03-init"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run cloudflare:14-logout"

["example:15-clean"]
description = "15. cloudflare:15-clean: the local state undone, .wrangler/ (the local D1, KV and R2, what deploys wrote) and .dev.vars; the next 06-serve starts from nothing"
depends = ["example:03-init"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run cloudflare:15-clean --yes"

["example:verify"]
description = "ci: what the repo's own GitHub workflow runs, here: its task cloudflare:verify (its setup and test tasks, then check). The workflow does only that, after it checks out and installs mise"
depends = ["example:03-init"]
dir = "{{config_root}}/{{ env.REPO_PATH | default(value='templates') }}"
env = { MISE_CEILING_PATHS = "{{config_root}}" }
run = "mise run cloudflare:verify"
