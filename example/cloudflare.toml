# cloudflare.toml: this repo on Cloudflare, for go tool cloudflare and the cloudflare:* tasks
# (github.com/joeblew999/mise-cloudflare). Never put an account ID, a resource ID, a token or a secret value here.

# The repo's own Cloudflare login, a wrangler auth profile. Default: the Worker's name, which it is here.
profile = "cloudflare-zero-example"

# No scopes line: the login asks for what wrangler's own login does, so it can do whatever wrangler can.
