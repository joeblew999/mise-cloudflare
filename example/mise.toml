# A Worker repo set up with mise-cloudflare exactly as any other repo is: go.mod's tool line, then go tool cloudflare
# init, which wrote the mise tasks in .mise/tasks/ (mise finds them there by itself): mise run cloudflare shows the way.

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]

[tools]
node = "26.11.1"   # runs wrangler
aube = "2.8.1"     # installs wrangler from package.json

[tasks.setup]
description = "Install the pinned wrangler, and make .dev.vars from .dev.vars.example for wrangler dev (no account)"
run = ["aube install", "cp -n .dev.vars.example .dev.vars || true"]
