# A Worker repo set up with mise-cloudflare as any repo is (mise run cloudflare shows the way), but on the tool built
# from this checkout, ../bin/mise-cloudflare, so it tests what's here. Any other repo pins the release instead:
# mise use github:joeblew999/mise-cloudflare@<version>

[env]
_.path = ["{{config_root}}/../bin"]

[settings]
# mise 2026.10 fails to install aube while it fetches its agent skill (a 404); it isn't needed.
skills.fetch = false

[tools]
node = "26.12.1"   # runs wrangler
aube = "2.8.1"     # installs wrangler from package.json

[tasks.setup]
description = "Install the pinned wrangler, and build ../bin/mise-cloudflare from this checkout"
run = ["aube install", "cd .. && go build -o bin/mise-cloudflare ./cmd/mise-cloudflare"]
