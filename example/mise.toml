# A Worker repo that uses cloudflare-zero exactly as any other repo would: go.mod's tool line, cloudflare.toml, and the
# tasks go tool cloudflare tasks writes into .mise/tasks/.

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]

[tools]
node = "26.11.1"   # runs wrangler
aube = "2.8.1"     # installs wrangler from package.json

[tasks.setup]
description = "Install the pinned wrangler, and make .dev.vars from .dev.vars.example for wrangler dev (no account)"
run = ["aube install", "cp -n .dev.vars.example .dev.vars || true"]

[tasks.dev]
description = "wrangler dev: the Worker on http://localhost:8787, with local D1, KV and R2 and .dev.vars (no account)"
run = "node node_modules/wrangler/bin/wrangler.js dev"

# cloudflare-zero's tasks, as go tool cloudflare tasks writes them.
[task_config]
includes = [".mise/tasks/cloudflare.toml"]
