# mise-cloudflare: a repo's own Cloudflare login, and wrangler on it, as a Go tool (go tool cloudflare) with its mise
# tasks and agent skill, the way github.com/joeblew999/go-htmx4's seo and intl are built. README.md says how to use it.
#
#   cmd/cloudflare/  the command;  config/  cloudflare.toml;  mise/  its tasks;  skills/  its agent skill
#   example/         a Worker repo that uses it, exactly as any other repo would
#   e2e/             the proofs, on a real Cloudflare account (mise run prove …)

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]

[tools]
node = "26.11.1"   # example/'s wrangler
aube = "2.8.1"     # installs it
usage = "7.0.1"    # --help and tab-completion for the tasks' flags
goreleaser = "2.18.3"   # the release's binaries (.goreleaser.yaml)
"npm:cf" = "1.0.0-beta.20"   # Cloudflare's own CLI: prove-builds' Workers Builds (a repo gets it from the cloudflare:builds task)

[tasks.example]
description = "Stamp example/ the way any repo gets mise-cloudflare: go tool cloudflare tasks and skill there, from this version (the Go tests fail while it's stale)"
dir = "example"
run = ["go tool cloudflare tasks", "go tool cloudflare skill"]

[tasks.test]
description = "The Go tests: no Cloudflare account, nothing deployed"
run = "go vet ./... && go test ./..."

[tasks.prove]
description = "Prove it end to end in example/, on its own login (a browser, or with CLOUDFLARE_LOGIN=device a link for any device, the first time only): a local Worker with no login at all, deploy, the live Worker's D1, KV, R2 and secret, a second deploy that asks nothing, stray tokens refused, everything deleted again, the machine's default login untouched. --clean also logs the login out"
usage = 'flag "--clean" help="also log the example login out and delete it; the next run logs in again"'
run = "CLOUDFLARE_E2E=1 PROVE_CLEAN=${usage_clean:-false} go test ./e2e -run '^TestProve$' -count=1 -v -timeout 30m"

[tasks.prove-other-repo]
description = "Prove a brand-new repo gets it all from config alone: go get -tool from GitHub (MISE_CLOUDFLARE_REF, default main), go tool cloudflare init, then the same proof on its own login (cloudflare-zero-other, kept for the next run; --clean logs it out)"
usage = 'flag "--clean" help="also log its login out and delete it"'
run = "CLOUDFLARE_E2E=1 PROVE_CLEAN=${usage_clean:-false} go test ./e2e -run '^TestOtherRepo$' -count=1 -v -timeout 30m"

[tasks.prove-basin]
description = "Prove Basin works on a repo's own login, no API token: in example/ make an R2 bucket, turn on Basin Catalog, create a Basin Pipeline (stream, catalog sink, SQL), send events with the login's token, read them back with Basin SQL, then remove it all"
run = "CLOUDFLARE_E2E=1 go test ./e2e -run '^TestBasin$' -count=1 -v -timeout 30m"

[tasks.prove-builds]
description = "Prove go tool cloudflare builds: Workers Builds deploys e2e/testdata/builds from GitHub with Cloudflare's own token, a push to a throwaway deploy branch going live and another branch getting a preview URL; then the setup, the branches and the Worker removed. main is never touched"
run = "CLOUDFLARE_E2E=1 go test ./e2e -run '^TestBuilds$' -count=1 -v -timeout 45m"
