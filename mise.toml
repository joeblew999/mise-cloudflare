# cloudflare-zero: Cloudflare without the token mess. Each repo gets its own wrangler login (a profile named after it,
# bound to its folder) and a few shared mise tasks for the glue. Plan: PLAN.md
#
#   shared/cloudflare/  the shared tasks (cloudflare:<verb>). Other repos include shared/ by git URL, pinned to a tag:
#                       git::https://github.com/joeblew999/cloudflare-zero.git//shared?ref=<tag>
#   example/            a minimal repo that uses them, as any other repo would. It has its own mise.toml, but mise also
#                       reads this one above it, so runs that prove it stands alone use a copy outside this repo.
#
# Shared tasks may only use settings the including repo is told to set (CF_PROFILE), never anything else of its.

[tools]
jq = "1.8.2"       # reads wrangler's JSON
usage = "7.0.1"    # --help and tab-completion for the tasks' #USAGE flags

[env]
CF_PROFILE = "cloudflare-zero"   # this repo's own Cloudflare login (a wrangler profile)
CF_ZERO_REF = "{{ get_env(name='CF_ZERO_REF', default='main') }}"   # the ref prove-other-repo includes by git URL; CF_ZERO_REF=<branch> in the shell tests a branch

[task_config]
includes = ["shared", "mise-tasks"]   # the shared tasks also run here, on this repo's own login; then its own
