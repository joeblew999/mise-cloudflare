# mise-cloudflare: a repo's own Cloudflare login, and wrangler on it, as a Go tool (go tool cloudflare) with its mise
# tasks and agent skill, the way github.com/joeblew999/go-htmx4's seo and intl are built. README.md says how to use it.
#
#   cmd/cloudflare/  the command, a file per command;  mise/  what init writes into a repo;  skills/  its agent skill
#   example/         a Worker repo that uses it, exactly as any other repo would
#   e2e/             one real deploy, before a release (mise run prove)

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]

[tools]
node = "26.11.1"   # example/'s wrangler
aube = "2.8.1"     # installs it
usage = "7.0.1"    # --help and tab-completion for the tasks' flags
goreleaser = "2.18.3"   # the release's binaries (.goreleaser.yaml)
"npm:cf" = "1.0.0-beta.20"   # Cloudflare's own CLI, for cloudflare github (a repo gets it from that task's tools)

[tasks.example]
description = "Set example/ up with this version, as any repo is: go tool cloudflare init there (the Go tests and cloudflare check fail while it's stale)"
dir = "example"
run = "go tool cloudflare init"

[tasks.test]
description = "The Go tests: no Cloudflare account, nothing deployed"
run = "go vet ./... && go test ./..."

[tasks.prove]
description = "The end-to-end tests, on a real Cloudflare account, before a release (about 40 minutes): example/ as a developer uses it, following the guide (secret, deploy, live D1, KV, R2 and secret, stray tokens refused); a new repo set up from GitHub by init alone; Cloudflare deploying every push (production from a throwaway branch, a pull request's preview, gone with its branch); GitHub Actions deploying (a push, a pull request's preview, gone when it closes). Everything deleted after. The first time, an Allow"
usage = 'flag "--clean" help="also log the example login out and delete it; the next run logs in again"'
run = "CLOUDFLARE_E2E=1 PROVE_CLEAN=${usage_clean:-false} go test ./e2e -run '^(TestProve|TestOtherRepo|TestGitHub|TestActions)$' -count=1 -v -timeout 120m"
