# mise-cloudflare: a repo's own Cloudflare login, and wrangler on it, as a Go tool (go tool cloudflare) with its mise
# tasks and agent skill, the way github.com/joeblew999/go-htmx4's seo and intl are built. README.md says how to use it.
#
#   cmd/cloudflare/  the command;  config/  cloudflare.toml;  mise/  its tasks;  skills/  its agent skill
#   example/         a Worker repo that uses it, exactly as any other repo would
#   e2e/             the proofs, on a real Cloudflare account (mise run prove …)

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]

[tools]
node = "26.11.1"   # example/'s wrangler
aube = "2.8.1"     # installs it
usage = "7.0.1"    # --help and tab-completion for the tasks' flags
goreleaser = "2.18.3"   # the release's binaries (.goreleaser.yaml)
"npm:cf" = "1.0.0-beta.20"   # Cloudflare's own CLI, for cloudflare:builds (a repo gets it from that task's tools)

[tasks.example]
description = "Stamp example/ the way any repo gets mise-cloudflare: go tool cloudflare tasks, skill, workflow and claude there, from this version (the Go tests and cloudflare:check fail while it's stale)"
dir = "example"
run = ["go tool cloudflare tasks", "go tool cloudflare skill", "go tool cloudflare workflow", "go tool cloudflare claude"]

[tasks.test]
description = "The Go tests: no Cloudflare account, nothing deployed"
run = "go vet ./... && go test ./..."

[tasks.prove]
description = "One real deploy, before a release (a few minutes): in example/, on its own login (the first time, an Allow), a local Worker with no login at all, a deploy, the live Worker's D1, KV, R2 and secret, stray tokens refused, everything deleted again; and a brand-new repo from GitHub (MISE_CLOUDFLARE_REF, default main) set up by init alone. --clean also logs the login out"
usage = 'flag "--clean" help="also log the example login out and delete it; the next run logs in again"'
run = "CLOUDFLARE_E2E=1 PROVE_CLEAN=${usage_clean:-false} go test ./e2e -run '^(TestProve|TestOtherRepo)$' -count=1 -v -timeout 30m"
