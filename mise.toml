# mise-cloudflare: a repo's own Cloudflare login, and wrangler on it, with its mise tasks and agent skill.
#
#   cmd/mise-cloudflare/  the command;  mise/  what init writes into a repo;  skills/  its agent skill
#   example/              a Worker repo that uses it, on the tool built from this checkout
#   e2e/                  a new repo as a user sets it up (mise run smoke), and real deploys (mise run prove)

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]
# mise 2026.10 fails to install aube and usage while it fetches their agent skills (a 404); they aren't needed.
skills.fetch = false

[tools]
node = "26.12.1"   # example/'s wrangler
aube = "2.8.1"     # installs it
usage = "7.0.1"    # --help and tab-completion for the tasks' flags
goreleaser = "2.18.3"   # the release's binaries (.goreleaser.yaml)
"npm:cf" = "1.0.0-beta.20"   # Cloudflare's own CLI, for mise run cloudflare:github

[tasks.build]
description = "Build bin/mise-cloudflare from this checkout"
run = "go build -o bin/mise-cloudflare ./cmd/mise-cloudflare"

[tasks.example]
description = "Write init's files into example/ again with this checkout's tool (the tests fail while they're stale)"
depends = ["build"]
dir = "example"
run = "../bin/mise-cloudflare init"

[tasks.test]
description = "The Go tests: no Cloudflare account, nothing deployed (sets example/ up first: the tests read its wrangler)"
run = "cd example && mise run setup && cd .. && go vet ./... && go test ./..."

[tasks.smoke]
description = "A new repo as a user sets it up, no Cloudflare account: mise-cloudflare from mise, init, then status, check and dev. This checkout's build, or a release with --version"
usage = 'flag "--version <version>" help="test this release from GitHub instead, as mise use installs it"'
depends = ["build"]
run = "MISE_CLOUDFLARE_SMOKE=1 MISE_CLOUDFLARE_VERSION=${usage_version:-} go test ./e2e -run '^TestNewRepo$' -count=1 -v -timeout 10m"

[tasks.prove]
description = "Real deploys on a Cloudflare account (about 30 minutes): example/ as a developer uses it (secret, deploy, live D1, KV, R2 and secret, stray tokens refused), then Cloudflare deploying every push (production, a pull request's preview, gone with its branch). Everything deleted after. The first time, an Allow"
usage = 'flag "--clean" help="also log the example login out and delete it; the next run logs in again"'
depends = ["build"]
run = "CLOUDFLARE_E2E=1 PROVE_CLEAN=${usage_clean:-false} go test ./e2e -run '^(TestProve|TestGitHub)$' -count=1 -v -timeout 120m"
