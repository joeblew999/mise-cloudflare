# Written by mise-cloudflare (cloudflare workflow, VERSION): don't edit it. After upgrading, run
# mise run cloudflare:workflow again; cloudflare:check fails while it's out of date.
#
# What GitHub Actions runs for the Worker in DIR on every push and pull request: its setup and test tasks if it has
# them, then cloudflare:check (no account or resource IDs, no tokens, secrets listed, wrangler pinned). No Cloudflare
# credentials: Cloudflare's Workers Builds deploys (mise run cloudflare:builds). Shell steps only: no JavaScript actions.
name: NAME

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: NAME-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A pull request from this repository already ran as a push; one from a fork runs here, read-only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # mise's GitHub downloads
      MISE_YES: "1"
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: mise and the pinned tools
        run: |
          echo "MISE_TRUSTED_CONFIG_PATHS=$PWD" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://mise.run | MISE_QUIET=1 sh
          export PATH="$HOME/.local/bin:$PATH" MISE_TRUSTED_CONFIG_PATHS="$PWD"
          cd "DIR" && mise install

      - name: setup, test and cloudflare:check, in DIR
        working-directory: DIR
        run: |
          if mise tasks info setup > /dev/null 2>&1; then mise run setup; fi
          if mise tasks info test > /dev/null 2>&1; then mise run test; fi
          mise run cloudflare:check
