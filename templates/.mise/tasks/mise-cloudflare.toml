# This repo's Cloudflare Worker. Start with: mise run cloudflare (what's done, and what to run next).
# One task per command, numbered in the order a repo meets them: mise run cloudflare:<nn>-<command> runs
# mise-cloudflare <command>. Steps 00 to 02 come before these tasks: the repo's git, mise install, its own setup.
# Written by mise-cloudflare (github.com/joeblew999/mise-cloudflare): don't edit it. .mise/config.toml pins its version.

["cloudflare"]
description = "Start here: what's done for this Worker, and what to run next (mise run cloudflare:show-help: every command)"
tools = { "npm:cf" = "1.0.0-beta.26", gh = "2.103.0" }
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = "mise-cloudflare ${usage_json:+--json}"

["cloudflare:03-init"]
description = "03. mise-cloudflare's files written into the repo again, after upgrading it (the first time, before these tasks: mise exec github:joeblew999/mise-cloudflare@<version> -- mise-cloudflare init)"
run = "mise-cloudflare init"

["cloudflare:04-check"]
description = "04. The repo's rules: no tokens or account IDs in it, secrets git-ignored, init's files current"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = "mise-cloudflare check ${usage_json:+--json}"

["cloudflare:05-show"]
description = "05. What's done for this Worker, and what to run next"
tools = { "npm:cf" = "1.0.0-beta.26", gh = "2.103.0" }
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = "mise-cloudflare show ${usage_json:+--json}"

["cloudflare:06-serve"]
description = "06. The Worker locally, with local D1, KV and R2: no Cloudflare account needed"
usage = 'arg "[args]..." help="passed on to wrangler dev as they are: --ip 127.0.0.1 --port 8787"'
run = "mise-cloudflare serve ${usage_args}"

["cloudflare:07-set-secrets"]
description = "07. The secrets the Worker requires that Cloudflare doesn't have yet: it asks for each"
run = "mise-cloudflare set-secrets"

["cloudflare:08-deploy"]
description = "08. The Worker on Cloudflare, on the repo's own login: the first time, you click Allow"
usage = 'arg "[args]..." help="passed on to wrangler deploy as they are"'
run = "mise-cloudflare deploy ${usage_args}"

["cloudflare:09-connect-github"]
description = "09. Cloudflare deploys every push: a preview for every pull request, then production (--staging main for staging, --off to stop)"
tools = { "npm:cf" = "1.0.0-beta.26", gh = "2.103.0" }
usage = 'flag "--off" help="turn it off: the Workers Builds setup and the previews resources deleted"; flag "--branch <branch>" help="the branch whose pushes deploy production (default the default branch of the repository, or production with --staging)"; flag "--staging <branch>" help="a staging branch, whose pushes deploy the wrangler environment env.staging"; flag "--build <command>" help="the build command (default installing from the lockfile: npm ci, …)"; flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-cloudflare connect-github ${usage_off:+--off} ${usage_branch:+--branch "$usage_branch"} ${usage_staging:+--staging "$usage_staging"} ${usage_build:+--build "$usage_build"} ${usage_json:+--json}'

["cloudflare:10-set-preview-secrets"]
description = "10. The secrets the Worker's previews require, which they don't inherit, in its Previews Base: it asks for each"
run = "mise-cloudflare set-preview-secrets"

["cloudflare:11-preview"]
description = "11. A preview of what's here now, at its own URL, with its own KV, D1 and R2 (--name my-test)"
usage = 'arg "[args]..." help="passed on to wrangler preview as they are: --name my-test"'
run = "mise-cloudflare preview ${usage_args}"

["cloudflare:12-login"]
description = "12. The repo's Cloudflare login (the others make it when they need it)"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = "mise-cloudflare login ${usage_json:+--json}"

["cloudflare:13-delete"]
description = "13. Deploy undone: the Worker deleted, then its own KV, D1 and R2 and its previews' own (it asks first; --yes doesn't)"
usage = 'flag "--yes" help="do not ask first"'
run = "mise-cloudflare delete ${usage_yes:+--yes}"

["cloudflare:14-logout"]
description = "14. The repo's Cloudflare logins logged out and deleted: wrangler's, and cf's for Workers Builds"
tools = { "npm:cf" = "1.0.0-beta.26" }
run = "mise-cloudflare logout"

["cloudflare:15-clean"]
description = "15. The local state undone, as 13-delete undoes Cloudflare's: .wrangler/ (the local D1, KV and R2, and what deploys wrote) and .dev.vars, so the next 06-serve starts from nothing (it asks first; --yes doesn't)"
usage = 'flag "--yes" help="do not ask first"'
run = "mise-cloudflare clean ${usage_yes:+--yes}"

["cloudflare:verify"]
description = "What the repo's GitHub workflow runs: its own setup and test tasks, if it has them, then check. The same here as on GitHub"
run = "mise-cloudflare verify"

["cloudflare:update"]
description = "The repo's own pins at their newest releases: its mise tools, its packages (with aube, whichever lockfile it has) and Go modules, mise-cloudflare's pin among them (at local it stays; moved, 03-init writes its files again). What changed is in git: the steps prove it"
run = "mise-cloudflare update"

["cloudflare:template"]
description = "The template's own Worker, in a repo with none yet: its code, wrangler.jsonc and package.json named for the repo's folder, the lockfile, .dev.vars.example, and the mise.toml that installs its wrangler. It never writes over a file: a repo with a Worker of its own gets none of it. Then mise install, mise run setup"
run = "mise-cloudflare template"

["cloudflare:run-wrangler"]
description = "Any other wrangler command, on the repo's login: mise run cloudflare:run-wrangler d1 list"
usage = 'arg "[args]..." help="the wrangler command, passed on as it is: d1 list"'
run = "mise-cloudflare run-wrangler ${usage_args}"

["cloudflare:show-version"]
description = "This mise-cloudflare's version"
run = "mise-cloudflare show-version"

["cloudflare:show-help"]
description = "Every command"
run = "mise-cloudflare show-help"
