# This repo's Cloudflare Worker. Start with: mise run cloudflare (what's done, and what to run next).
# One task per command: mise run cloudflare:<command> runs mise-cloudflare <command>.
# Written by mise-cloudflare (github.com/joeblew999/mise-cloudflare): don't edit it. The repo's mise.toml pins its version.

["cloudflare"]
description = "Start here: what's done for this Worker, and what to run next (mise run cloudflare:help: every command)"
tools = { "npm:cf" = "1.0.0-beta.20", gh = "2.103.0" }
run = "mise-cloudflare"

["cloudflare:status"]
description = "What's done for this Worker, and what to run next"
tools = { "npm:cf" = "1.0.0-beta.20", gh = "2.103.0" }
run = "mise-cloudflare status"

["cloudflare:check"]
description = "The repo's rules: no tokens or account IDs in it, secrets git-ignored, init's files current"
run = "mise-cloudflare check"

["cloudflare:dev"]
description = "1. Run the Worker locally, with local D1, KV and R2: no Cloudflare account needed"
run = "mise-cloudflare dev"

["cloudflare:secret"]
description = "The secrets the Worker requires that Cloudflare doesn't have yet: it asks for each (--previews: its previews')"
run = "mise-cloudflare secret"

["cloudflare:deploy"]
description = "2. Deploy the Worker yourself: the first time, you click Allow"
run = "mise-cloudflare deploy"

["cloudflare:github"]
description = "3. Have Cloudflare deploy every push: a preview for every pull request, then production (--staging main for staging)"
tools = { "npm:cf" = "1.0.0-beta.20", gh = "2.103.0" }
run = "mise-cloudflare github"

["cloudflare:preview"]
description = "A preview of what's here now, at its own URL, with its own KV, D1 and R2 (--name my-test)"
run = "mise-cloudflare preview"

["cloudflare:wrangler"]
description = "Any other wrangler command, on the repo's login: mise run cloudflare:wrangler d1 list"
run = "mise-cloudflare wrangler"

["cloudflare:login"]
description = "The repo's Cloudflare login (the others make it when they need it)"
run = "mise-cloudflare login"

["cloudflare:delete"]
description = "Deploy undone: the Worker deleted, then its own KV, D1 and R2 and its previews' own (it asks first; --yes doesn't)"
run = "mise-cloudflare delete"

["cloudflare:logout"]
description = "The repo's Cloudflare logins logged out and deleted: wrangler's, and cf's for Workers Builds"
tools = { "npm:cf" = "1.0.0-beta.20" }
run = "mise-cloudflare logout"

["cloudflare:init"]
description = "After upgrading mise-cloudflare: its files written into the repo again (the first time, before these tasks: mise exec -- mise-cloudflare init)"
run = "mise-cloudflare init"

["cloudflare:version"]
description = "This mise-cloudflare's version"
run = "mise-cloudflare version"

["cloudflare:help"]
description = "Every command"
run = "mise-cloudflare help"
